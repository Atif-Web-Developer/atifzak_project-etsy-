<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<style>
  :root { --g: #066b5e; --g2: #10b981; --bd: #dfe3e8; --mut: #6b7280; --bg: #f6f8f7; --red: #dc2626; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; font-size: 13px; color: #1f2937; margin: 0; background: var(--bg); }
  header { background: linear-gradient(120deg, var(--g), var(--g2)); color: #fff; padding: 14px 16px; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 2px 0 0; opacity: .85; font-size: 12px; }
  main { padding: 12px; }
  .card { background: #fff; border: 1px solid var(--bd); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); margin: 0 0 10px; }
  label { display: block; font-weight: 600; margin: 8px 0 3px; font-size: 12px; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--bd); border-radius: 6px; font: inherit; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--g2); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
  input[readonly] { background: #f3f4f6; color: #374151; }
  textarea { resize: vertical; }
  #paste { min-height: 120px; font-family: Consolas, monospace; font-size: 11px; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; min-width: 0; }
  button { cursor: pointer; border: 0; border-radius: 6px; padding: 8px 12px; font: inherit; font-weight: 600; }
  .btn { background: var(--g); color: #fff; } .btn:hover { background: #055047; }
  .btn-light { background: #eef2f1; color: #1f2937; }
  .btn-warn { background: #f59e0b; color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .full { width: 100%; }
  .hint { color: var(--mut); font-size: 11px; margin-top: 4px; }
  .msg { padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
  .msg.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .msg.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .msg.warn { display: block; background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
  .calc { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--bd); }
  .calc:last-child { border: 0; } .calc span { color: var(--mut); } .calc b { font-variant-numeric: tabular-nums; }
  .pos { color: #059669; } .neg { color: var(--red); }
  details summary { cursor: pointer; font-weight: 600; }
  .filled { animation: flash 1.2s ease; } @keyframes flash { from { box-shadow: 0 0 0 3px rgba(16,185,129,.45); } to { box-shadow: none; } }
  .sticky { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 2px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>eBay Dropshipping</h1>
  <p>Paste an eBay listing, check the fields, submit.</p>
</header>
<main>
  <div id="msg" class="msg"></div>

  <div class="card">
    <label for="tab" style="margin-top:0">Save into tab</label>
    <select id="tab"></select>
    <div id="newTabWrap" class="hidden">
      <label for="newTab">New tab name</label>
      <input id="newTab" placeholder="e.g. Kitchen products">
    </div>
  </div>

  <div class="card">
    <h2>Paste from eBay</h2>
    <textarea id="paste" placeholder="Paste the full text you copied from the eBay listing page…"></textarea>
    <div class="row" style="margin-top:8px">
      <div><button class="btn full" id="autofill">Auto Fill</button></div>
      <div style="flex:0 0 auto"><button class="btn-light" id="clearPaste">Clear</button></div>
    </div>
    <div class="hint" id="fillResult"></div>
  </div>

  <div class="card"><h2>From the eBay page</h2><div id="autoFields"></div></div>
  <div class="card">
    <h2>Your research</h2>
    <details open style="margin-bottom:10px">
      <summary>Quick fill from supplier page</summary>
      <label for="supPlatform">Supplier</label>
      <select id="supPlatform"></select>
      <textarea id="supPaste" style="margin-top:6px;min-height:80px;font-family:Consolas,monospace;font-size:11px" placeholder="Page URL on the first line, then paste the supplier page text…"></textarea>
      <button class="btn full" id="supFill" style="margin-top:6px">Auto Fill Supplier</button>
      <div class="hint" id="supResult"></div>
    </details>
    <details style="margin-bottom:10px">
      <summary>Add a competitor (eBay page)</summary>
      <textarea id="compPaste" style="margin-top:6px;min-height:80px;font-family:Consolas,monospace;font-size:11px" placeholder="Paste another seller's eBay page, or eBay links – it fills by itself…"></textarea>
      <button class="btn full" id="compAdd" style="margin-top:6px">Add Competitor</button>
      <div class="hint" id="compResult"></div>
    </details>
    <div id="manualFields"></div>
  </div>

  <div class="card">
    <h2>Calculated</h2>
    <div id="calcFields"></div>
    <div class="hint" id="calcHint">Enter My Listed Price to see the results.</div>
  </div>

  <div class="card">
    <details>
      <summary>Settings <span class="hint" id="feeSummary"></span></summary>
      <div class="row">
        <div><label for="s_ebay_fee_pct">eBay Fee %</label><input id="s_ebay_fee_pct" class="setting" type="number" step="0.01"></div>
        <div><label for="s_ad_rate_pct">Ad Rate %</label><input id="s_ad_rate_pct" class="setting" type="number" step="0.01"></div>
      </div>
      <div class="row">
        <div><label for="s_ebay_fixed_fee">Fixed ≤</label><input id="s_ebay_fixed_fee" class="setting" type="number" step="0.01"></div>
        <div><label for="s_fixed_fee_threshold">Threshold $</label><input id="s_fixed_fee_threshold" class="setting" type="number" step="0.01"></div>
        <div><label for="s_ebay_fixed_fee_high">Fixed &gt;</label><input id="s_ebay_fixed_fee_high" class="setting" type="number" step="0.01"></div>
      </div>
      <label for="s_sales_tax_pct">Sales Tax buffer % (0 = ignore)</label><input id="s_sales_tax_pct" class="setting" type="number" step="0.01">
      <button class="btn-light full" id="saveSettings" style="margin-top:8px">Save settings</button>
    </details>
  </div>

  <div id="dupBox" class="card hidden" style="border-color:#fcd34d;background:#fffbeb">
    <b>This Item ID already exists</b>
    <p class="hint" id="dupText" style="color:#92400e"></p>
    <div class="row">
      <div><button class="btn-light full" id="dupCancel">Cancel</button></div>
      <div><button class="btn-warn full" id="dupUpdate">Update existing row</button></div>
    </div>
  </div>

  <div class="sticky"><button class="btn full" id="submit">Submit</button></div>
</main>

<script>
/*__EBAY_TOOL__*/
</script>
<script>
var state = { columns: [], settings: {}, statuses: [] };
var $ = function (id) { return document.getElementById(id); };

function show(type, text) { var m = $('msg'); m.className = 'msg ' + type; m.textContent = text; window.scrollTo(0, 0); }
function hideMsg() { $('msg').className = 'msg'; }

/* ---- Build the form from COLUMNS (Code.gs) */
function buildForm(data) {
  state = data;
  var tab = $('tab');
  tab.innerHTML = '';
  data.tabs.forEach(function (t) {
    var o = document.createElement('option');
    o.value = t.name;
    o.textContent = t.usable ? t.name : t.name + ' (has other data)';
    o.disabled = !t.usable;  // tabs with your own existing data are never written to
    tab.appendChild(o);
  });
  var n = document.createElement('option'); n.value = '__new__'; n.textContent = '➕ Create new tab…'; tab.appendChild(n);
  tab.value = data.lastTab || '__new__';
  toggleNewTab();

  ['autoFields', 'manualFields', 'calcFields'].forEach(function (id) { $(id).innerHTML = ''; });
  data.columns.forEach(function (c) {
    if (c.group === 'calc') {
      var row = document.createElement('div'); row.className = 'calc';
      row.innerHTML = '<span></span><b id="calc_' + c.key + '"></b>';
      row.querySelector('span').textContent = c.header;
      $('calcFields').appendChild(row);
      return;
    }
    var wrap = document.createElement('div');
    var label = document.createElement('label'); label.textContent = c.header; label.htmlFor = 'f_' + c.key;
    var input;
    if (c.type === 'textarea') { input = document.createElement('textarea'); input.rows = 3; input.placeholder = c.placeholder || 'One link per line'; }
    else if (c.type === 'status') {
      input = document.createElement('select');
      data.statuses.forEach(function (s) { var o = document.createElement('option'); o.value = o.textContent = s; input.appendChild(o); });
    } else {
      input = document.createElement('input');
      if (c.type === 'money') { input.type = 'number'; input.step = '0.01'; input.min = '0'; }
      if (c.type === 'number') { input.type = 'number'; input.step = '1'; input.min = '0'; }
      if (c.type === 'url' || c.type === 'image') { input.type = 'url'; input.placeholder = 'https://'; }
      if (c.type === 'link') { input.readOnly = true; input.placeholder = 'Built from the ID'; }
    }
    input.id = 'f_' + c.key;
    if (c.default !== undefined) input.value = c.default;
    wrap.appendChild(label); wrap.appendChild(input);
    $(c.group === 'auto' ? 'autoFields' : 'manualFields').appendChild(wrap);
  });

  CALC_INPUTS.forEach(function (k) { $('f_' + k).addEventListener('input', recalc); });
  $('f_seller_price').addEventListener('input', recalc);

  // Price suggestions under "My Listed Price" – click one or type your own price.
  var sug = document.createElement('div');
  sug.className = 'hint';
  sug.innerHTML = 'Suggested: <span id="suggestButtons">add the Supplier Cost first</span>' +
    '<div style="margin-top:4px">Target profit <input id="targetMargin" type="number" min="0" max="80" step="1" style="width:60px;padding:3px 6px"> %</div>';
  $('f_listed_price').parentNode.appendChild(sug);
  var saved = null; try { saved = localStorage.getItem('ebay-target-margin'); } catch (e) {}
  $('targetMargin').value = saved || 20;
  $('targetMargin').addEventListener('input', function () {
    try { localStorage.setItem('ebay-target-margin', $('targetMargin').value); } catch (e) {}
    recalc();
  });
  $('f_item_id').addEventListener('input', updateLink);
  applySettings(data.settings);
}

function toggleNewTab() { $('newTabWrap').classList.toggle('hidden', $('tab').value !== '__new__'); }
function updateLink() {
  // A pasted eBay URL becomes just its Item ID.
  var fromUrl = $('f_item_id').value.match(/(?:\/itm\/(?:[^\s\/?#]+\/)?|[?&]item=)(\d{9,15})/i);
  if (fromUrl) $('f_item_id').value = fromUrl[1];
  var id = $('f_item_id').value.replace(/\s+/g, '');
  $('f_ebay_link').value = /^\d+$/.test(id) ? 'https://www.ebay.com/itm/' + id : '';
}

var SETTING_KEYS = ['ebay_fee_pct', 'ad_rate_pct', 'ebay_fixed_fee', 'fixed_fee_threshold', 'ebay_fixed_fee_high', 'sales_tax_pct'];
var CALC_INPUTS = ['listed_price', 'my_shipping', 'supplier_cost', 'supplier_shipping', 'other_cost'];

function applySettings(s) {
  state.settings = s;
  SETTING_KEYS.forEach(function (k) { $('s_' + k).value = s[k]; });
  $('feeSummary').textContent = '(' + s.ebay_fee_pct + '% + ' + Number(s.ebay_fixed_fee).toFixed(2) + '/' +
    Number(s.ebay_fixed_fee_high).toFixed(2) + ', ads ' + s.ad_rate_pct + '%' + (Number(s.sales_tax_pct) ? ', tax ' + s.sales_tax_pct + '%' : '') + ')';
  recalc();
}

/* ---- Live calculation (same formulas as the sheet) */
function recalc() {
  var values = {};
  CALC_INPUTS.forEach(function (k) { values[k] = $('f_' + k).value; });
  var r = EbayTool.calculate(values, state.settings);
  EbayTool.CALC_KEYS.forEach(function (k) {
    var el = $('calc_' + k); if (!el) return;
    var pct = k === 'profit_pct' || k === 'roi';
    el.textContent = r[k] === null ? '' : EbayTool.money(r[k]) + (pct ? '%' : '');
    el.className = (r[k] !== null && (k === 'profit' || pct)) ? (r.profit >= 0 ? 'pos' : 'neg') : '';
  });
  $('calcHint').classList.toggle('hidden', r.hasPrice);
  renderSuggestions(values);
}

function renderSuggestions(values) {
  var wrap = $('suggestButtons'); if (!wrap) return;
  values.seller_price = $('f_seller_price').value;
  var s = EbayTool.suggestPrices(values, state.settings, $('targetMargin').value);
  wrap.innerHTML = '';
  if (!s || (!s.target && !s.undercut)) { wrap.textContent = 'add the Supplier Cost first'; return; }
  [['target', Number(s.margin) + '% profit'], ['undercut', '1¢ below competitor']].forEach(function (pair) {
    var x = s[pair[0]]; if (!x || x.price === null) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn-light';
    b.style.cssText = 'padding:3px 8px;margin:3px 4px 0 0;font-size:11px;' + (x.profit < 0 ? 'color:#c62828' : 'color:#05603a');
    b.textContent = pair[1] + ': $' + EbayTool.money(x.price) + ' (' + (x.profit < 0 ? 'loss' : 'profit') + ' $' + EbayTool.money(x.profit) + ')';
    b.addEventListener('click', function () { $('f_listed_price').value = EbayTool.money(x.price); flashField($('f_listed_price')); recalc(); });
    wrap.appendChild(b);
  });
}

/* ---- Auto Fill */
var AUTO = ['item_id', 'product_name', 'seller_name', 'seller_feedback', 'seller_price', 'buyer_shipping', 'sold_orders', 'sales_line', 'variation'];
function autoFill() {
  var text = $('paste').value;
  if (!text.trim()) { $('fillResult').textContent = 'Paste the eBay page text first.'; return; }
  var d = EbayTool.parse(text), filled = 0;
  AUTO.forEach(function (k) {
    var el = $('f_' + k); if (!el) return;
    el.value = d[k];
    el.classList.remove('filled');
    if (d[k] !== '') { filled++; void el.offsetWidth; el.classList.add('filled'); }
  });
  updateLink();
  $('fillResult').textContent = 'Filled ' + filled + ' of ' + AUTO.length + ' fields' + (filled < AUTO.length ? ' – check the empty ones.' : '.') +
    (d.item_id ? '' : ' No Item ID in the text: copy the listing address (Ctrl+L, Ctrl+C) and paste it into the ID box.');
}

/* ---- Quick fill for "Your research" (same parser as the website) */
function flashField(el) { el.classList.remove('filled'); void el.offsetWidth; el.classList.add('filled'); }
EbayTool.SUPPLIERS.forEach(function (s) {
  var o = document.createElement('option'); o.value = s.key; o.textContent = s.label; $('supPlatform').appendChild(o);
});
try { $('supPlatform').value = localStorage.getItem('ebay-supplier-platform') || 'auto'; } catch (e) {}
if (!$('supPlatform').value) $('supPlatform').value = 'auto';
$('supPlatform').addEventListener('change', function () {
  try { localStorage.setItem('ebay-supplier-platform', $('supPlatform').value); } catch (e) {}
});
$('supFill').addEventListener('click', function () {
  var text = $('supPaste').value;
  if (!text.trim()) { $('supResult').textContent = 'Paste the supplier page text first.'; return; }
  var r = EbayTool.parseSupplier(text, $('supPlatform').value), filled = 0;
  if (r.platform === 'ebay') { $('supResult').textContent = r.notes[0]; return; }
  ['supplier_link', 'supplier_cost', 'supplier_shipping'].forEach(function (k) {
    var el = $('f_' + k); el.value = r[k];
    if (r[k] !== '') { filled++; flashField(el); }
  });
  recalc();
  $('supResult').textContent = EbayTool.supplierLabel(r.platform) + ': filled ' + filled + ' of 3.' + (r.notes.length ? ' ' + r.notes.join(' ') : '');
});
$('compAdd').addEventListener('click', function () {
  var text = $('compPaste').value;
  if (!text.trim()) { $('compResult').textContent = 'Paste a competitor eBay page first.'; return; }
  var c = EbayTool.parseCompetitors(text);
  if (c.kind === 'supplier') { $('compResult').textContent = 'This looks like a supplier page – use "Quick fill from supplier page".'; return; }
  if (c.kind === 'page_no_link') {
    ['competitor_feedbacks', 'competitor_sold'].forEach(function (k) {
      if (c[k] !== '') { $('f_' + k).value = c[k]; flashField($('f_' + k)); }
    });
    $('compPaste').value = '';
    $('compResult').textContent = 'Filled ' + (c.seller || 'competitor') + ' (feedback ' + (c.competitor_feedbacks || '-') +
      ', sold ' + (c.competitor_sold || '-') + '). No link in the copied text – copy the page address (Ctrl+L, Ctrl+C) and paste it here.';
    return;
  }
  if (!c.links.length) { $('compResult').textContent = 'No eBay listing found – paste a competitor eBay page or eBay links.'; return; }
  var ownId = $('f_item_id').value.trim();
  var links = c.links.filter(function (l) { return !ownId || l.slice(-ownId.length) !== ownId; });
  if (!links.length) { $('compResult').textContent = 'That is your own listing – paste a different seller.'; return; }
  var added = 0, res;
  links.forEach(function (l) { res = EbayTool.addLine($('f_competitor_links').value, l); $('f_competitor_links').value = res.value; if (res.added) added++; });
  flashField($('f_competitor_links'));
  if (c.kind === 'page') {
    ['competitor_feedbacks', 'competitor_sold'].forEach(function (k) {
      if (c[k] !== '') { $('f_' + k).value = c[k]; flashField($('f_' + k)); }
    });
  }
  $('compPaste').value = '';
  $('compResult').textContent = (c.kind === 'page'
    ? (added ? 'Added ' : 'Already listed: ') + (c.seller || 'competitor')
    : 'Added ' + added + ' of ' + links.length + ' link(s)') + ' – total ' + res.count + '.';
});

// Paste = fill: run the matching Auto Fill as soon as text is pasted.
[['paste', 'autofill'], ['supPaste', 'supFill'], ['compPaste', 'compAdd']].forEach(function (pair) {
  $(pair[0]).addEventListener('paste', function () { setTimeout(function () { $(pair[1]).click(); }, 0); });
});

/* ---- Submit */
function collect() {
  var data = {};
  state.columns.forEach(function (c) { if (c.group !== 'calc') { var el = $('f_' + c.key); data[c.key] = el ? el.value.trim() : ''; } });
  return data;
}
function submit(confirmUpdate) {
  hideMsg();
  var btn = $('submit'); btn.disabled = true; btn.textContent = 'Saving…';
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; btn.textContent = 'Submit';
      if (res.duplicate) {
        $('dupText').textContent = 'Item ' + $('f_item_id').value + ' is already in “' + res.tab + '” (row ' + res.row + '). Update it with these values?';
        $('dupBox').classList.remove('hidden');
        $('dupBox').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      $('dupBox').classList.add('hidden');
      var text = (res.updated ? 'Updated row ' : 'Added as row ') + res.row + ' in “' + res.tab + '”.';
      if (window.Swal) {
        Swal.fire({ icon: 'success', title: res.updated ? 'Product updated!' : 'Product added!', text: text,
                    confirmButtonColor: '#066b5e', timer: 4000, timerProgressBar: true });
      } else {
        show('ok', text + ' Ready for the next product.');
      }
      clearForm(res.tab);
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Submit';
      var msg = err.message || String(err);
      if (window.Swal) Swal.fire({ icon: 'error', title: 'Not saved', text: msg, confirmButtonColor: '#066b5e' });
      else show('err', msg);
    })
    .submitProduct(collect(), $('tab').value, $('newTab').value, !!confirmUpdate);
}

function clearForm(tabName) {
  $('paste').value = ''; $('fillResult').textContent = ''; $('newTab').value = '';
  ['supPaste', 'compPaste'].forEach(function (id) { $(id).value = ''; });
  ['supResult', 'compResult'].forEach(function (id) { $(id).textContent = ''; });
  state.columns.forEach(function (c) {
    var el = $('f_' + c.key); if (!el) return;
    el.value = c.default !== undefined ? c.default : '';
    if (c.type === 'status') el.value = state.statuses[0];
  });
  google.script.run.withSuccessHandler(function (data) { data.lastTab = tabName; buildForm(data); }).getFormData();
}

/* ---- Wire up */
$('tab').addEventListener('change', toggleNewTab);
$('autofill').addEventListener('click', autoFill);
$('clearPaste').addEventListener('click', function () { $('paste').value = ''; $('fillResult').textContent = ''; });
$('submit').addEventListener('click', function () { submit(false); });
$('dupUpdate').addEventListener('click', function () { $('dupBox').classList.add('hidden'); submit(true); });
$('dupCancel').addEventListener('click', function () { $('dupBox').classList.add('hidden'); });
SETTING_KEYS.forEach(function (k) {
  $('s_' + k).addEventListener('input', function () {
    SETTING_KEYS.forEach(function (key) { state.settings[key] = parseFloat($('s_' + key).value) || 0; });
    recalc();
  });
});
$('saveSettings').addEventListener('click', function () {
  google.script.run
    .withSuccessHandler(function (s) { applySettings(s); show('ok', 'Settings saved. All formulas now use them.'); })
    .withFailureHandler(function (e) { show('err', e.message || String(e)); })
    .saveSettingsFromForm(state.settings);
});

google.script.run
  .withSuccessHandler(buildForm)
  .withFailureHandler(function (e) { show('err', e.message || String(e)); })
  .getFormData();
</script>
</body>
</html>
