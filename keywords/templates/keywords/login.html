<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Atif-Zak Analytics</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #020617; /* Slate 950 */
            --bg-card: rgba(15, 23, 42, 0.6); /* Slate 900 with opacity */
            --primary-glow: #10b981; /* Emerald */
            --secondary-glow: #3b82f6; /* Blue */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Animated Deep Space Background */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px; height: 400px;
            background: var(--primary-glow);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px; height: 500px;
            background: var(--secondary-glow);
            bottom: -150px; right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px; height: 300px;
            background: #8b5cf6; /* Violet */
            top: 40%; left: 60%;
            animation-delay: -10s;
            opacity: 0.3;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        /* Glassmorphism Card */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
            transform: translateY(30px);
            opacity: 0;
            animation: proEntrance 1s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        @keyframes proEntrance {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Branding */
        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-icon-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .brand-icon {
            font-size: 2.5rem;
            color: var(--text-main);
            position: relative;
            z-index: 2;
        }

        .brand-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            background: var(--primary-glow);
            filter: blur(20px);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Inputs */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: var(--text-main) !important;
            border-radius: 12px;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .form-control:focus {
            border-color: var(--primary-glow) !important;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15), inset 0 2px 4px rgba(0,0,0,0.2) !important;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            transition: color 0.3s ease;
        }

        .form-control:focus + .input-icon {
            color: var(--primary-glow);
        }

        /* Buttons */
        .btn-ai {
            background: linear-gradient(135deg, var(--primary-glow), #059669);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-ai::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease;
        }

        .btn-ai:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary-glow);
        }

        .btn-ai:hover::before {
            opacity: 1;
        }

        .bottom-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .bottom-link a {
            color: var(--primary-glow);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .bottom-link a:hover {
            color: #34d399;
            text-decoration: underline;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- Ambient Animated Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="glass-card">
        <div class="brand-header">
            <div class="brand-icon-wrapper">
                <div class="brand-glow"></div>
                <i class="fas fa-microchip brand-icon"></i>
            </div>
            <h1 class="title">Atif-Zak Analytics</h1>
            <p class="subtitle">Enter your portal to intelligent insights</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert-error">
                    <i class="fas fa-exclamation-triangle me-2"></i> Invalid credentials. Please try again.
                </div>
            {% endif %}

            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Username" required autocomplete="off">
                <i class="fas fa-user input-icon"></i>
            </div>

            <div class="form-group mb-4">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
                <i class="fas fa-lock input-icon"></i>
            </div>

            <button type="submit" class="btn btn-ai">
                INITIALIZE SECURE LOGIN <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="bottom-link">
            Secured Portal. Unauthorized Access Prohibited.
        </div>
    </div>

</body>
</html>
