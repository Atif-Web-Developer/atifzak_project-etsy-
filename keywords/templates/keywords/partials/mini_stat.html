{% load humanize %}
<div class="col-xl-3 col-md-6">
    <a href="{{ link }}" class="card card-animate card-height-100 text-body">
        <div class="card-body d-flex align-items-center gap-3">
            <div class="avatar-sm flex-shrink-0"><span class="avatar-title bg-{{ color }}-subtle text-{{ color }} rounded fs-3"><i class="{{ icon }}"></i></span></div>
            <div class="flex-grow-1 overflow-hidden">
                <p class="text-uppercase fw-medium text-muted text-truncate mb-1">{{ label }}</p>
                <h4 class="mb-0 ff-secondary">{{ value|intcomma }}</h4>
                {% if note %}<small class="text-muted">{{ note }}</small>{% endif %}
            </div>
            <i class="ri-arrow-right-s-line fs-20 text-muted"></i>
        </div>
    </a>
</div>
