{% extends 'layouts/auth.html' %}
{% block title %}Password updated{% endblock %}
{% block form %}
<div class="text-center py-4">
    <div class="avatar-lg mx-auto mb-4">
        <span class="avatar-title bg-success-subtle text-success rounded-circle display-6"><i class="ri-checkbox-circle-line"></i></span>
    </div>
    <h4 class="fw-semibold">Password updated</h4>
    <p class="text-muted">Your password has been set. You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-primary mt-2">Sign in</a>
</div>
{% endblock %}
