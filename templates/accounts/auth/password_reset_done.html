{% extends 'layouts/auth.html' %}
{% block title %}Check your email{% endblock %}
{% block form %}
<div class="text-center py-4">
    <div class="avatar-lg mx-auto mb-4">
        <span class="avatar-title bg-success-subtle text-success rounded-circle display-6"><i class="ri-mail-check-line"></i></span>
    </div>
    <h4 class="fw-semibold">Check your inbox</h4>
    <p class="text-muted mx-3">If an account exists for that email, we've sent instructions to reset the password. Don't forget to check your spam folder.</p>
    <a href="{% url 'login' %}" class="btn btn-primary mt-3"><i class="ri-arrow-left-line align-middle me-1"></i> Back to sign in</a>
</div>
{% endblock %}
