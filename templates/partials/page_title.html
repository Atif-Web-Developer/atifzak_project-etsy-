<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
            <h4 class="mb-sm-0">{{ title }}</h4>
            <div class="page-title-right">
                <ol class="breadcrumb m-0">
                    <li class="breadcrumb-item"><a href="{% url 'overview' %}">Home</a></li>
                    {% if parent %}<li class="breadcrumb-item">{% if parent_url %}<a href="{{ parent_url }}">{{ parent }}</a>{% else %}{{ parent }}{% endif %}</li>{% endif %}
                    <li class="breadcrumb-item active">{{ title }}</li>
                </ol>
            </div>
        </div>
    </div>
</div>
